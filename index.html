<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c11" />
    <!-- use-credentials: the manifest sits behind Cloudflare Access, which needs the cookie. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RepRun" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>RepRun</title>
    <meta name="description" content="Your gym and running log, on your phone. Self-hosted and free on Cloudflare." />
    <!-- Link previews. Previews need a full URL: point these at your own domain if you share yours. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RepRun" />
    <meta property="og:description" content="Your gym and running log, on your phone. Self-hosted and free on Cloudflare." />
    <meta property="og:image" content="https://demo.danielhadaway.dev/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Target for <Tap /> labels: tapping one flips this, which gives iOS its haptic tick (src/lib/haptic.tsx). -->
    <input type="checkbox" switch id="haptic" hidden aria-hidden="true" tabindex="-1" />
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html><html><head><meta charset="utf-8">
<!-- The link-preview image (og.jpg) for reprun.co.uk and the app. Not deployed.
     To re-render: open this file in a browser at 1200 × 630 (or a Playwright screenshot at deviceScaleFactor 2),
     scale the PNG to 1200 × 630 and save as JPEG under ~250 KB (WhatsApp drops big ones), then copy it to
     site/public/og.jpg and public/og.jpg. Phones are the demo screenshots in public/screenshots (made-up data only). --><style>
@font-face { font-family: Inter; src: url(../public/fonts/inter-400.woff2); font-weight: 400; }
@font-face { font-family: Inter; src: url(../public/fonts/inter-600.woff2); font-weight: 600; }
@font-face { font-family: Inter; src: url(../public/fonts/inter-800.woff2); font-weight: 800; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: Inter, sans-serif; color: #e8eaf0; -webkit-font-smoothing: antialiased;
  background: radial-gradient(800px 500px at 85% 20%, rgb(129 140 248 / 0.16), transparent 60%), radial-gradient(600px 400px at 75% 110%, rgb(34 211 238 / 0.12), transparent 60%), #0a0c11; }
.copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
.brand { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; }
.brand img { width: 92px; height: 92px; }
.brand b { font-weight: 800; font-size: 72px; letter-spacing: -0.035em; }
.g { background: linear-gradient(90deg, #818cf8, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
h1 { font-weight: 800; font-size: 46px; line-height: 1.08; letter-spacing: -0.035em; margin-bottom: 14px; }
p { font-size: 23px; color: #8b93a7; margin-bottom: 30px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chips span { border: 1px solid #242a38; background: rgb(18 21 29 / 0.8); border-radius: 999px; padding: 9px 16px; font-size: 19px; font-weight: 600; color: #c9cdd8; }
/* Frames match the screenshots' shape (824 × 1784), so each screen fills its phone edge to edge. */
.phone { position: absolute; width: 236px; aspect-ratio: 824 / 1784; padding: 9px; border-radius: 40px;
  background: linear-gradient(160deg, #2a3040, #12151d 40%, #1a1f2b); box-shadow: 0 0 0 1.5px #2e3546, 0 40px 80px -20px rgb(0 0 0 / 0.85), 0 0 120px -30px rgb(129 140 248 / 0.5); }
.phone .screen { width: 100%; height: 100%; border-radius: 32px; overflow: hidden; position: relative; background: #0a0c11; }
.phone .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
.back { left: 700px; top: 66px; transform: rotate(-6deg); opacity: 0.92; }
.front { left: 900px; top: 44px; transform: rotate(4deg); }
</style></head><body>
<div class="copy">
  <div class="brand"><img src="../public/favicon.svg" alt=""><b>Rep<span class="g">Run</span></b></div>
  <h1>Your gym and running app, for <span class="g">£0</span>.</h1>
  <p>No account, no subscription, open source.</p>
  <div class="chips"><span>Live workout logger</span><span>Routines + progression</span><span>PBs &amp; charts</span><span>Strava runs</span></div>
</div>
<div class="phone back"><div class="screen"><img src="../../public/screenshots/home.jpg" alt=""></div></div>
<div class="phone front"><div class="screen"><img src="../../public/screenshots/workout.jpg" alt=""></div></div>
</body></html>
